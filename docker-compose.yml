# Services de développement local. Ne pas utiliser tel quel en production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: teranga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teranga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teranga_dev}
      POSTGRES_DB: ${POSTGRES_DB:-teranga_fleet}
    ports:
      - '${POSTGRES_PORT:-5436}:5432'
    volumes:
      - teranga-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Capture les emails envoyés par l'API en développement (rien ne part réellement).
  # Interface : http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: teranga-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1026}:1025'
      - '${MAILPIT_UI_PORT:-8026}:8025'

volumes:
  teranga-postgres-data:
