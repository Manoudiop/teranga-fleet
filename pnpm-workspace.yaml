packages:
  - apps/*
  - packages/*

# Scripts d'installation des dépendances.
# Autorisés : moteurs Prisma, binaire esbuild (tsx), binaire natif argon2.
# Refusés : paquets qui livrent déjà des binaires précompilés.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: false

# expo-router embarque Radix, qui installe @types/react-dom@19.3 alors que
# Expo 57 fixe @types/react ~19.2. Types uniquement, sans impact à l'exécution.
peerDependencyRules:
  allowedVersions:
    '@types/react-dom>@types/react': '19.2'
